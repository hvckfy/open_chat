# EXAMPLE ONLY — do not commit real key material. In production, generate
# each validator's seed out-of-band and load it via your secret manager's
# CSI driver / External Secrets Operator rather than `kubectl create
# secret -f`. One key per StatefulSet replica, selected at pod startup by
# ordinal (see the initContainer in 30-statefulset.yaml) — this is the
# standard way to hand heterogeneous per-replica secrets to a
# StatefulSet, since every replica shares one pod template.
#
#   kubectl create secret generic openchat-validator-keys \
#     --namespace openchat \
#     --from-literal=seed-0=$(openssl rand -hex 32) \
#     --from-literal=seed-1=$(openssl rand -hex 32) \
#     --from-literal=seed-2=$(openssl rand -hex 32) \
#     --from-literal=seed-3=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: openchat-validator-keys
  namespace: openchat
type: Opaque
stringData:
  seed-0: "REPLACE_WITH_A_FRESH_32_BYTE_HEX_ED25519_SEED"
  seed-1: "REPLACE_WITH_A_FRESH_32_BYTE_HEX_ED25519_SEED"
  seed-2: "REPLACE_WITH_A_FRESH_32_BYTE_HEX_ED25519_SEED"
  seed-3: "REPLACE_WITH_A_FRESH_32_BYTE_HEX_ED25519_SEED"
---
apiVersion: v1
kind: Secret
metadata:
  name: openchat-node-tls
  namespace: openchat
type: kubernetes.io/tls
data:
  tls.crt: "" # base64-encoded certificate
  tls.key: "" # base64-encoded private key
