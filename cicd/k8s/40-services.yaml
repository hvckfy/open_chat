# Headless Service: gives each pod a stable DNS name
# (openchat-node-<ordinal>.openchat-node-headless.openchat.svc.cluster.local)
# used for libp2p bootstrap/peer dialing between validators.
apiVersion: v1
kind: Service
metadata:
  name: openchat-node-headless
  namespace: openchat
spec:
  clusterIP: None
  selector: {app: openchat-node}
  ports:
    - {name: p2p, port: 4001, targetPort: p2p}
    - {name: grpc, port: 9090, targetPort: grpc}

---
# Regular ClusterIP Service: what clients actually dial (directly, or via
# an Ingress/Gateway/L4 LoadBalancer in front of this for external
# access). kube-proxy load-balances across whichever validator pods are
# Ready, giving clients a single, always-available gRPC entrypoint.
apiVersion: v1
kind: Service
metadata:
  name: openchat-node-grpc
  namespace: openchat
spec:
  selector: {app: openchat-node}
  ports:
    - {name: grpc, port: 9090, targetPort: grpc}
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: openchat-node-metrics
  namespace: openchat
  labels: {app: openchat-node}
spec:
  selector: {app: openchat-node}
  ports:
    - {name: metrics, port: 2112, targetPort: metrics}
  type: ClusterIP
