syntax = "proto3";

package openchat.v1;

option go_package = "openchat/internal/grpcserver/pb;pb";

// -----------------------------------------------------------------------
// OpenChat gRPC gateway contract.
//
// This file is the authoritative interface definition for the node<->client
// gateway described in the architecture doc (README.md, section 4).
//
// Reference codegen (requires protoc + protoc-gen-go + protoc-gen-go-grpc):
//   protoc --go_out=. --go-grpc_out=. api/protobuf/sms.proto
//
// The checked-in server/client in internal/grpcserver and pkg/client were
// hand-written against this exact contract (see internal/grpcserver/pb.go)
// because the sandbox this project was authored in had no network access to
// fetch protoc/plugins. The wire format used by the hand-written code is a
// drop-in JSON codec registered under the standard "proto" content-subtype
// name, so client and server interoperate over real gRPC/HTTP2/TLS exactly
// as they would with generated code. Swapping to real protoc-gen-go output
// later is a mechanical, non-breaking change: keep the same field names.
// -----------------------------------------------------------------------

service NodeGateway {
  // GetAddress returns this node's validator address (ed25519 pubkey) and
  // basic identity/version info. Used by clients to sanity check a gateway.
  rpc GetAddress(Empty) returns (AddressResponse);

  // SendSMS accepts a signed message transaction from a client and enqueues
  // it into the node's mempool for gossip + consensus inclusion.
  rpc SendSMS(SMSRequest) returns (SMSResponse);

  // StreamIncomingSMS opens a long-lived server-streaming channel. The
  // client proves ownership of its address with a signature over a
  // freshness nonce/timestamp; the node pushes every new SMS transaction
  // addressed `To` that pubkey as soon as it lands in a committed block.
  rpc StreamIncomingSMS(StreamRequest) returns (stream SMSResponse);

  // GetNodesDiscovery returns a fresh list of currently-live RPC gateways
  // known to this node, so clients can build/refresh their local failover
  // cache without hardcoding the whole network topology.
  rpc GetNodesDiscovery(DiscoveryRequest) returns (DiscoveryResponse);
}

message Empty {}

message AddressResponse {
  string validator_address = 1; // hex ed25519 pubkey of this node/validator
  string node_version       = 2;
  uint64 chain_height       = 3;
  uint32 peer_count         = 4;
}

// SMSRequest carries one fully-formed, client-signed transaction.
// `ciphertext` is opaque to the network: AES-256-GCM output produced by the
// sender from an X25519 ECDH shared secret with the recipient. The node
// never sees plaintext.
message SMSRequest {
  string from_address   = 1; // hex ed25519 pubkey of sender
  string to_address     = 2; // hex ed25519 pubkey of recipient
  bytes  ciphertext      = 3; // AES-256-GCM(sealed message)
  bytes  nonce_aead       = 4; // 12-byte AES-GCM nonce
  bytes  ephemeral_pubkey = 5; // sender's X25519 pubkey used for this ECDH
  uint64 nonce            = 6; // strictly-incrementing per-sender tx nonce (replay protection)
  int64  timestamp        = 7; // unix millis, must be within node's freshness window
  bytes  signature        = 8; // ed25519 signature over the canonical tx encoding
}

message SMSResponse {
  bool   accepted        = 1;
  string tx_hash          = 2;
  string error            = 3;
  // populated only on StreamIncomingSMS pushes:
  SMSRequest message       = 4;
  uint64 block_height      = 5;
}

message StreamRequest {
  string address   = 1; // hex ed25519 pubkey the client wants to receive for
  int64  timestamp = 2; // unix millis, signed freshness proof
  bytes  signature = 3; // ed25519 signature over `address || timestamp`, proves key ownership
}

message DiscoveryRequest {
  uint32 max_results = 1;
}

message DiscoveryResponse {
  repeated GatewayInfo gateways = 1;
}

message GatewayInfo {
  string grpc_address     = 1; // host:port
  string validator_address = 2; // hex ed25519 pubkey
  int64  last_seen_unix     = 3;
}
